<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Doorbell - Event Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .header { background: #1976d2; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; }
        .header .status { display: flex; align-items: center; gap: 1rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #4caf50; }
        .status-dot.offline { background: #f44336; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab { padding: 0.75rem 1.5rem; background: white; border: none; cursor: pointer; border-radius: 8px 8px 0 0; color: #666; }
        .tab.active { background: white; color: #1976d2; border-bottom: 3px solid #1976d2; }
        .content { background: white; border-radius: 0 8px 8px 8px; padding: 1.5rem; min-height: 500px; }
        .event-list { display: flex; flex-direction: column; gap: 1rem; }
        .event-card { display: flex; gap: 1rem; padding: 1rem; border: 1px solid #eee; border-radius: 8px; cursor: pointer; transition: box-shadow 0.2s; }
        .event-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .event-card .thumbnails { display: flex; gap: 0.5rem; }
        .event-card .thumbnail { width: 120px; height: 80px; object-fit: cover; border-radius: 4px; background: #eee; }
        .event-info { flex: 1; }
        .event-info h3 { color: #1976d2; margin-bottom: 0.5rem; }
        .event-info p { color: #666; font-size: 0.875rem; }
        .event-meta { display: flex; gap: 1rem; color: #999; font-size: 0.75rem; }
        .event-type { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
        .event-type.person { background: #e3f2fd; color: #1976d2; }
        .event-type.battery { background: #fff3e0; color: #f57c00; }
        .event-type.storage { background: #fce4ec; color: #c2185b; }
        .config-form { max-width: 500px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; }
        .form-group input[type="range"] { width: 100%; }
        .form-group .value { color: #1976d2; font-weight: bold; }
        button { padding: 0.75rem 1.5rem; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1565c0; }
        .empty { text-align: center; padding: 3rem; color: #999; }
        .video-player { width: 100%; max-width: 800px; margin: 0 auto; }
        .video-player video { width: 100%; border-radius: 8px; }
        .nav-links { display: flex; gap: 1rem; }
        .nav-links a { color: white; text-decoration: none; opacity: 0.8; }
        .nav-links a:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Smart Doorbell</h1>
        <div class="status">
            <span id="connectionStatus">Connecting...</span>
            <div class="status-dot" id="statusDot"></div>
        </div>
        <nav class="nav-links">
            <a href="index.html">Events</a>
            <a href="live.html">Live</a>
            <a href="config.html">Config</a>
        </nav>
    </div>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showTab('events')">Events</button>
            <button class="tab" onclick="showTab('live')">Live View</button>
            <button class="tab" onclick="showTab('config')">Configuration</button>
        </div>
        
        <div class="content">
            <div id="tab-events">
                <h2>Recent Events</h2>
                <div id="eventList" class="event-list">
                    <div class="empty">Loading events...</div>
                </div>
            </div>
            
            <div id="tab-live" style="display:none;">
                <h2>Live View</h2>
                <div class="video-player">
                    <video id="liveVideo" controls autoplay>
                        <source src="" type="application/x-mpegURL">
                    </video>
                    <p style="text-align:center;color:#666;margin-top:1rem;">
                        Live stream will appear when device is connected
                    </p>
                </div>
            </div>
            
            <div id="tab-config" style="display:none;">
                <h2>Device Configuration</h2>
                <div class="config-form">
                    <div class="form-group">
                        <label>Detection Sensitivity: <span class="value" id="sensitivityValue">0.7</span></label>
                        <input type="range" id="sensitivity" min="0.3" max="0.95" step="0.05" value="0.7">
                    </div>
                    <div class="form-group">
                        <label>Min Duration (seconds): <span class="value" id="minDurationValue">2</span></label>
                        <input type="range" id="minDuration" min="1" max="10" step="1" value="2">
                    </div>
                    <div class="form-group">
                        <label>Cooldown (seconds): <span class="value" id="cooldownValue">60</span></label>
                        <input type="range" id="cooldown" min="10" max="300" step="10" value="60">
                    </div>
                    <div class="form-group">
                        <label>Record Duration (seconds): <span class="value" id="recordDurationValue">10</span></label>
                        <input type="range" id="recordDuration" min="5" max="30" step="5" value="10">
                    </div>
                    <div class="form-group">
                        <label>Retention Days: <span class="value" id="retentionDaysValue">30</span></label>
                        <input type="range" id="retentionDays" min="1" max="90" step="1" value="30">
                    </div>
                    <button onclick="saveConfig()">Save Configuration</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let ws = null;
        let events = [];

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content > div').forEach(d => d.style.display = 'none');
            document.getElementById('tab-' + tab).style.display = 'block';
            event.target?.classList.add('active');
        }

        function updateConnectionStatus(connected) {
            document.getElementById('statusDot').className = 'status-dot ' + (connected ? 'online' : 'offline');
            document.getElementById('connectionStatus').textContent = connected ? 'Connected' : 'Disconnected';
        }

        async function loadEvents() {
            try {
                const res = await fetch(`${API_BASE}/api/events?limit=50`);
                const data = await res.json();
                events = data.events || [];
                renderEvents();
            } catch (e) {
                document.getElementById('eventList').innerHTML = '<div class="empty">Failed to load events. Is the server running?</div>';
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventList');
            if (events.length === 0) {
                container.innerHTML = '<div class="empty">No events recorded yet</div>';
                return;
            }
            
            container.innerHTML = events.map(event => `
                <div class="event-card">
                    <div class="thumbnails">
                        ${event.thumbnails?.length > 0 
                            ? event.thumbnails.map((t, i) => `<img class="thumbnail" src="${t}" alt="Thumb ${i+1}">`).join('')
                            : '<div class="thumbnail"></div><div class="thumbnail"></div><div class="thumbnail"></div>'
                        }
                    </div>
                    <div class="event-info">
                        <h3>${formatEventType(event.event_type)}</h3>
                        <p>Device: ${event.device_id.substring(0, 12)}...</p>
                        <div class="event-meta">
                            <span class="event-type ${getEventTypeClass(event.event_type)}">${event.event_type}</span>
                            <span>${new Date(event.timestamp).toLocaleString()}</span>
                            ${event.confidence ? `<span>Confidence: ${(event.confidence * 100).toFixed(0)}%</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function formatEventType(type) {
            const map = {
                'person_detected': 'Person Detected',
                'low_battery': 'Low Battery',
                'storage_low': 'Storage Low',
                'device_offline': 'Device Offline'
            };
            return map[type] || type;
        }

        function getEventTypeClass(type) {
            if (type === 'person_detected') return 'person';
            if (type === 'low_battery') return 'battery';
            if (type === 'storage_low') return 'storage';
            return '';
        }

        async function loadConfig() {
            try {
                const res = await fetch(`${API_BASE}/api/devices`);
                const data = await res.json();
                if (data.devices?.length > 0) {
                    const deviceId = data.devices[0].id;
                    const configRes = await fetch(`${API_BASE}/api/devices/${deviceId}/config`);
                    const config = await configRes.json();
                    
                    document.getElementById('sensitivity').value = config.sensitivity;
                    document.getElementById('sensitivityValue').textContent = config.sensitivity;
                    document.getElementById('minDuration').value = config.min_duration;
                    document.getElementById('minDurationValue').textContent = config.min_duration;
                    document.getElementById('cooldown').value = config.cooldown;
                    document.getElementById('cooldownValue').textContent = config.cooldown;
                    document.getElementById('recordDuration').value = config.record_duration;
                    document.getElementById('recordDurationValue').textContent = config.record_duration;
                    document.getElementById('retentionDays').value = config.retention_days;
                    document.getElementById('retentionDaysValue').textContent = config.retention_days;
                }
            } catch (e) {
                console.error('Failed to load config:', e);
            }
        }

        async function saveConfig() {
            const sensitivity = parseFloat(document.getElementById('sensitivity').value);
            const minDuration = parseInt(document.getElementById('minDuration').value);
            const cooldown = parseInt(document.getElementById('cooldown').value);
            const recordDuration = parseInt(document.getElementById('recordDuration').value);
            const retentionDays = parseInt(document.getElementById('retentionDays').value);

            try {
                const res = await fetch(`${API_BASE}/api/devices`);
                const data = await res.json();
                if (data.devices?.length > 0) {
                    const deviceId = data.devices[0].id;
                    await fetch(`${API_BASE}/api/devices/${deviceId}/config`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sensitivity, minDuration, cooldown, recordDuration, retentionDays })
                    });
                    alert('Configuration saved!');
                }
            } catch (e) {
                alert('Failed to save configuration');
            }
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8080/ws');
            
            ws.onopen = () => {
                updateConnectionStatus(true);
            };
            
            ws.onclose = () => {
                updateConnectionStatus(false);
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'event') {
                    events.unshift(data.data);
                    renderEvents();
                }
            };
        }

        // Event listeners for sliders
        ['sensitivity', 'minDuration', 'cooldown', 'recordDuration', 'retentionDays'].forEach(id => {
            const input = document.getElementById(id);
            const value = document.getElementById(id + 'Value');
            input.addEventListener('input', () => { value.textContent = input.value; });
        });

        // Initialize
        loadEvents();
        loadConfig();
        connectWebSocket();
    </script>
</body>
</html>
